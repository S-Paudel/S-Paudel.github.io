# CRB Damage Monitor — handles issues opened from the web page:
#   "[CRB link] …"   analyse pasted links / selected photos
#   "[CRB review] …" record a confirmed / rejected decision (palm photos and surveillance records)
# ("[CRB alert]" issues are opened by the daily surveillance job and are not processed here.)
# Runs automatically for the repository owner and collaborators. For anyone else,
# add the label "crb-approved" to the issue to let it run.

name: CRB monitor — links and reviews

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: crb-monitor-data
  cancel-in-progress: false

jobs:
  handle:
    if: >-
      (startsWith(github.event.issue.title, '[CRB link]') || startsWith(github.event.issue.title, '[CRB review]')) &&
      (
        (github.event.action == 'opened' &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
        (github.event.action == 'labeled' && github.event.label.name == 'crb-approved')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: crb-monitor/pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crb-monitor/pipeline/requirements.txt

      - name: Install (CPU-only PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache models (CLIP + SAM3)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            crb-monitor/pipeline/sam3.pt
          key: crb-models-v1

      - name: Process issue
        env:
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m crbmon issue --event "$GITHUB_EVENT_PATH" --summary "$RUNNER_TEMP/summary.md"

      - name: Commit results
        working-directory: .
        run: |
          git config user.name "crb-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crb-monitor/data
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "CRB monitor: issue #${{ github.event.issue.number }}"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push

      - name: Reply and close
        if: always()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ -f "$RUNNER_TEMP/summary.md" ]; then
            printf '\n\nThe monitor page updates within a few minutes: https://s-paudel.github.io/crb-monitor.html\n' >> "$RUNNER_TEMP/summary.md"
            gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/summary.md"
            gh issue close "$NUMBER"
          else
            gh issue comment "$NUMBER" --body "Sorry — processing failed. See the workflow log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
